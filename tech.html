<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Projects | D. Ware</title>
<meta name="description" content="Explore featured software and security projects from Deja “D” Ware, including FLARE and upcoming monitoring work.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tech Projects | D. Ware">
<meta property="og:description" content="Featured software, security, and monitoring work from Deja “D” Ware.">
<meta property="og:image" content="images/headshot.jpg">
<meta property="og:image:alt" content="Portrait of Deja Ware">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* ============ Shared theme + layout for De's site ============ */

:root {
  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-tech: 'Space Grotesk', 'IBM Plex Mono', monospace;
  --font-body: 'Inter', -apple-system, sans-serif;
}

/* LIGHT — cool & technical */
html[data-theme="light"] {
  --bg: #E4E8ED; --panel: #F5F7F9; --ink: #1E2733; --ink-dim: #5B6774;
  --accent: #3E6E8E; --accent-2: #8C5A3C; --line: rgba(30,39,51,0.14);
  --card-ink: #1E2733; --btn-ink: #F5F7F9;
}

/* DARK — bold high-contrast */
html[data-theme="dark"] {
  --bg: #0B0B0C; --panel: #141416; --ink: #F5F3EE; --ink-dim: #8C8B87;
  --accent: #00C2FF; --accent-2: #E8B23D; --line: rgba(245,243,238,0.14);
  --card-ink: #F5F3EE; --btn-ink: #0B0B0C;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
}

a { color: inherit; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px clamp(20px, 6vw, 64px); border-bottom: 1px solid var(--line);
}
.topbar .logo { font-family: var(--font-tech); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; text-decoration:none; }
.topbar nav { display: flex; align-items: center; gap: 26px; }
.topbar nav a {
  font-family: var(--font-tech); font-size: 12.5px; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--ink-dim); text-decoration: none;
  border-bottom: 1px solid transparent; padding-bottom: 2px;
}
.topbar nav a:hover, .topbar nav a.current { color: var(--ink); border-color: var(--accent); }
.topbar .cta {
  font-family: var(--font-tech); font-size: 12px; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 9px 16px; border-radius: 8px;
  background: var(--accent); color: var(--btn-ink); text-decoration: none;
}
.theme-toggle {
  font-family: var(--font-tech); font-size: 11px; letter-spacing: 0.05em;
  text-transform: uppercase; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--ink-dim); cursor: pointer;
}

.eyebrow {
  font-family: var(--font-tech); letter-spacing: 0.16em; text-transform: uppercase;
  font-size: 11.5px; color: var(--accent); margin-bottom: 10px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }

.wrap { padding: 0 clamp(20px, 6vw, 64px); }

.gh-cta, .primary-cta {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-tech);
  font-size: 13px; text-decoration: none; padding: 13px 22px; border-radius: 10px;
  background: var(--accent); color: var(--btn-ink); font-weight: 600;
}
.secondary-cta {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-tech);
  font-size: 13px; text-decoration: none; padding: 12px 20px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--ink);
}

.note { font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }

</style>
<style>
  .page-hero { padding: 48px clamp(20px, 6vw, 64px) 32px; }
  .page-hero h1 { font-family: var(--font-tech); font-size: clamp(26px, 4vw, 36px); margin-bottom: 8px; }
  .page-hero p { color: var(--ink-dim); max-width: 60ch; font-size: 14.5px; line-height: 1.6; }

  .work-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 16px;
    padding: 0 clamp(20px, 6vw, 64px) 20px;
  }
  .work-card {
    border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: var(--panel);
  }
  .work-card .tag {
    display: inline-block; font-family: var(--font-tech); font-size: 10px;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; margin-bottom: 10px;
  }
  .work-card.soon .tag { color: var(--accent-2); border-color: var(--accent-2); }
  .work-card h3 { font-family: var(--font-tech); font-size: 16px; margin-bottom: 6px; }
  .work-card p { font-size: 13px; color: var(--ink-dim); line-height: 1.5; margin-bottom: 12px; }
  .work-card a.repo-link { font-family: var(--font-tech); font-size: 12px; color: var(--accent); text-decoration: none; }

  .gh-block { padding: 24px clamp(20px, 6vw, 64px) 72px; }
</style>
</head>
<body>

  <div class="topbar">
    <a class="logo" href="index.html">D. WARE</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="tech.html" class="current">Tech</a>
      <a href="insurance.html">Insurance</a>
    </nav>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="theme-toggle" onclick="toggleTheme()">Dark mode</button>
      <a class="cta" href="https://github.com/dware11" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <div class="page-hero">
    <div class="eyebrow">Lane 01</div>
    <h1>Featured Work</h1>
    <p>A short list of what I'd point you to first. Everything else — in-progress, old coursework, one-offs — lives on GitHub.</p>
  </div>

  <div class="work-grid" id="work-grid"></div>

  <div class="gh-block">
    <a class="gh-cta" href="https://github.com/dware11" target="_blank" rel="noopener">View everything on GitHub &rarr;</a>
  </div>

<script>
  /* ====================================================================
     TO UPDATE THIS PAGE: edit the array below. Nothing else needs to change.
     Each project is one object:
       tag:  small label, e.g. "Senior Design", "Hackathon", "Coming soon"
       name: project title
       desc: one sentence, plain language, what it does / why it matters
       url:  link to the repo (or leave "" if there's no link yet)
       soon: true if it's not public/finished yet (renders in the accent-2 color)
     ==================================================================== */
  const PROJECTS = [
    {
      tag: "Senior Design",
      name: "FLARE",
      // TODO: replace with real project description
      desc: "Swap in your one-line pitch — what it does and why it's the flagship.",
      url: "https://github.com/dware11/FLARE",
      soon: false
    },
    {
      tag: "Hackathon",
      name: "Hackathon Build",
      // TODO: replace with real project description
      desc: "Swap in your one-line pitch here.",
      url: "https://github.com/dware11/hackathon",
      soon: false
    },
    {
      tag: "Coming soon",
      name: "Endpoint / DLP Monitor",
      desc: "Lightweight file-integrity and change monitoring for my own laptop — no bloated AV suite, just clean logs.",
      url: "",
      soon: true
    }
  ];

  const grid = document.getElementById('work-grid');
  PROJECTS.forEach(p => {
    const card = document.createElement('div');
    card.className = 'work-card' + (p.soon ? ' soon' : '');
    card.innerHTML = `
      <span class="tag">${p.tag}</span>
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      ${p.url ? `<a class="repo-link" href="${p.url}" target="_blank" rel="noopener">View repo &rarr;</a>` : ''}
    `;
    grid.appendChild(card);
  });

  function toggleTheme(){
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.querySelector('.theme-toggle').textContent = next === 'light' ? 'Dark mode' : 'Light mode';
  }
  const savedTheme = localStorage.getItem('theme');
  const initialTheme = savedTheme ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', initialTheme);
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelector('.theme-toggle').textContent =
      initialTheme === 'light' ? 'Dark mode' : 'Light mode';
  });
</script>

</body>
</html>
